# Settings for pipeline/Snakefile. Any value can be overridden on the command line:
#   snakemake --use-conda --config mag_origin=M5_3 site=M5

# MAG set to analyse: <site>_<assembly depth in cmbsf>
mag_origin: "M1_3"
# site the reads come from (must match the raw_reads/<site>_<depth>_R1.fastq.gz file names)
site: "M1"

# sediment depths (cmbsf) that were sequenced
depths: [1, 3, 5, 7, 10, 25]

# MAG ids used for each MAG set (refs/<mag_origin>.<id>.filtered.fa)
mag_numbers:
  M1_3: [216, 182, 23, 34, 148, 61, 88, 93, 156, 191]
  M5_3: [105, 122, 180, 18, 202, 248, 252, 39, 3, 64, 68]
  M5_25: [13, 108, 117, 21, 68, 31, 17, 82]

# External databases / tools - set these to their location on your system
eggnog_data_dir: "/path/to/eggnog-db"                     # download_eggnog_data.py
uniref90_mmseqs_db: "/path/to/MMSEQS_DBs/uniref90"        # mmseqs databases UniRef90 ...
normalize_paired_regions_bin: "/path/to/normalize_paired_regions"  # https://github.com/Winshipe/Normalise-Paired-Regions
tmp_dir: "/tmp"
